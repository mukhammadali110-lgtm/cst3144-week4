<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue.js Pet Depot</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>{{ sitename }}</h1>
            <button v-on:click="showProduct = !showProduct">
                {{ cartItemCount }}
                <span class="fas fa-cart-plus"></span> Checkout
            </button>
        </header>

        <main>
            <div v-if="showProduct">
                <div>
                    <button
                        v-for="item in products"
                        :key="item.id"
                        type="button"
                        v-on:click="selectedProductId = item.id"
                        style="margin: 0 4px 4px 0;">
                        {{ item.title }}
                    </button>
                </div>

                <figure class="product-figure">
                    <img v-bind:src="product.image" v-bind:alt="product.title" class="product-image" />
                </figure>
                <h2>{{ product.title }}</h2>
                <p v-html="product.description"></p>
                <p>Price: {{ formattedPrice }}</p>

                <button v-on:click="addToCart" v-if="canAddToCart">
                    Add to cart
                </button>
                <span v-if="remainingInventory < 5 && remainingInventory > 0">
                    Only {{ remainingInventory }} left!
                </span>
                <button disabled v-else>
                    Add to cart
                </button>
            </div>

            <div v-else>
                <h2>Shopping Cart</h2>
                <ul v-if="cart.length">
                    <li v-for="item in cart" :key="item.id + '-' + $index">
                        {{ item.title }} - {{ formattedPriceFor(item.price) }}
                    </li>
                </ul>
                <p v-else>Your cart is empty.</p>
                <p v-if="cart.length">Total: {{ cartTotal }}</p>
                <button v-on:click="showProduct = true">Continue shopping</button>
            </div>
        </main>
    </div>

    <script type="text/javascript">
        new Vue({
            el: '#app',
            data: {
                sitename: 'Vue.js Pet Depot',
                showProduct: true,
                selectedProductId: 1001,
                products: [
                    {
                        id: 1001,
                        title: 'Cat Food, 25lb bag',
                        description: 'A 25 pound bag of <em>irresistible</em> organic goodness for your cat.',
                        price: 2000,
                        image: 'pet.png',
                        availableInventory: 10
                    },
                    {
                        id: 1002,
                        title: 'Dog Treats pack',
                        description: 'Crunchy <em>healthy</em> dog treats made with real chicken and vegetables.',
                        price: 850,
                        image: '../Screenshot 2026-10-12 at 3.02.05 PM.png',
                        availableInventory: 8
                    },
                    {
                        id: 1003,
                        title: 'Fish Tank Cleaner',
                        description: 'A complete <em>easy-clean</em> solution for keeping your aquarium fresh and clear.',
                        price: 1500,
                        image: '../Screenshot 2026-10-12 at 3.03.34 PM.png',
                        availableInventory: 6
                    },
                    {
                        id: 1004,
                        title: 'Pet Grooming Brush',
                        description: 'A <em>gentle</em> brush designed for smooth coats and easy daily grooming.',
                        price: 1200,
                        image: '../Screenshot 2026-10-12 at 3.04.15 PM.png',
                        availableInventory: 12
                    },
                    {
                        id: 1005,
                        title: 'Pet Bed, Large',
                        description: 'A <em>soft</em> and cozy padding bed for pets who love to rest in comfort.',
                        price: 2200,
                        image: 'https://images.unsplash.com/photo-1535268647677-300dbf3d78d1?auto=format&fit=crop&w=900&q=80',
                        availableInventory: 5
                    }
                ],
                cart: []
            },
            computed: {
                product: function() {
                    return this.products.find(function(item) {
                        return item.id === this.selectedProductId;
                    }, this);
                },
                cartItemCount: function() {
                    return this.cart.length;
                },
                remainingInventory: function() {
                    if (!this.product) {
                        return 0;
                    }
                    var cartCount = this.cart.filter(function(item) {
                        return item.id === this.product.id;
                    }, this).length;
                    return this.product.availableInventory - cartCount;
                },
                canAddToCart: function() {
                    return this.remainingInventory > 0;
                },
                formattedPrice: function() {
                    return this.formattedPriceFor(this.product.price);
                },
                cartTotal: function() {
                    var total = this.cart.reduce(function(sum, item) {
                        return sum + item.price;
                    }, 0);
                    return this.formattedPriceFor(total);
                }
            },
            cardcount: 0,
            methods: {
                formattedPriceFor: function(price) {
                    return '$' + (price / 100).toFixed(2);
                },
                addToCart: function() {
                    if (this.canAddToCart) {
                        this.cart.push({
                            id: this.product.id,
                            title: this.product.title,
                            price: this.product.price
                        });
                    }
                }
            }
        });
    </script>
</body>
</html>
